name: Flatter

on:
  push:
    branches:
      - yukigram
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  flatter:
    name: Flatter
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/andyholmes/flatter/gnome:49
      options: --privileged
      volumes:
        - /opt/hostedtoolcache:/hostedtoolcache

    steps:
      - name: Free up disk space
        shell: bash
        run: |
          rm -rf /hostedtoolcache/*
          df -h

      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Flatpak dependencies
        run: |
          flatpak install --noninteractive org.freedesktop.Sdk.Extension.llvm21/x86_64/25.08

      - name: Build
        uses: andyholmes/flatter@main
        with:
          files: |
            io.github.yukigram.yml
          arch: x86_64
          upload-bundles: true
          upload-pages-artifact: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: flatter
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
